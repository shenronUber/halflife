// Voice behavior: edit this file, then exec vf_voice_behavior.cfg on the server.
// Native game units. Counters expire this many seconds after the heard line ends.
vf_voices 1
vf_taunts 1
vf_counter_taunts 1
vf_taunt_radius 768
vf_counter_window 5
vf_taunt_cooldown 6
// Bots use the same hearing, dialogue priority and cooldown as human players.
vf_bot_taunts 1
vf_bot_taunt_chance 0.25
vf_bot_taunt_interval 12
vf_bot_counter_chance 0.7
vf_bot_counter_delay 0.8
